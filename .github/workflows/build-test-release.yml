name: build-test-release

on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:

permissions:
  contents: write

jobs:
  test-linux:
    name: test linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format

      - name: lint
        run: make CC=clang clang-format clang-tidy

      - name: test
        run: make CC=clang PFLAGS=-v test

  test-windows:
    name: test windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang-tools-extra
            mingw-w64-clang-x86_64-clang
            make
            diffutils

      - name: lint
        shell: msys2 {0}
        run: make CC=clang clang-format clang-tidy

      - name: test
        shell: msys2 {0}
        run: make CC=clang PFLAGS=-v test

  test-macos:
    name: test macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: lint
        run: make CC=clang clang-format clang-tidy

      - name: test
        run: make CC=clang PFLAGS=-v test

  dist:
    runs-on: ${{ matrix.runner }}
    name: dist
    needs:
      - test-linux
      - test-windows
      - test-macos
    strategy:
      matrix:
        include:
          # Linux — statically linked with musl via prebuilt musl.cc
          # toolchains.  Produces fully static binaries that run on any
          # Linux kernel regardless of the host libc.
          - name: linux-x86-64
            runner: ubuntu-latest
            musl_target: linux-amd64
            cc: x86_64-linux-musl-gcc
            dist: targz-pkg

          - name: linux-i686
            runner: ubuntu-latest
            musl_target: linux-i386
            cc: i686-linux-musl-gcc
            dist: targz-pkg

          - name: linux-aarch64
            runner: ubuntu-latest
            musl_target: linux-arm64
            cc: aarch64-linux-musl-gcc
            dist: targz-pkg

          - name: linux-arm-gnueabihf
            runner: ubuntu-latest
            musl_target: linux-armhf
            cc: arm-linux-musleabihf-gcc
            dist: targz-pkg

          - name: linux-arm-gnueabi
            runner: ubuntu-latest
            musl_target: linux-armel
            cc: arm-linux-musleabi-gcc
            dist: targz-pkg

          # macOS
          - name: macos-arm64
            cc: clang
            runner: macos-latest
            pkg_manager: brew install
            packages: coreutils
            dist: targz-pkg
            macos_deployment_target: "11.0"

          - name: macos-x86-64
            cc: clang
            runner: macos-15-intel
            pkg_manager: brew install
            packages: coreutils
            dist: targz-pkg
            macos_deployment_target: "10.12"

          # Windows (cross-compiled from Linux)
          - name: windows-i686
            cc: i686-w64-mingw32-gcc
            runner: ubuntu-latest
            pkg_manager: sudo apt-get update && sudo apt-get install -y
            packages: gcc-mingw-w64
            dist: zip-pkg

          - name: windows-x86_64
            cc: x86_64-w64-mingw32-gcc
            runner: ubuntu-latest
            pkg_manager: sudo apt-get update && sudo apt-get install -y
            packages: gcc-mingw-w64
            dist: zip-pkg

    steps:
      - uses: actions/checkout@v4

      - name: fetch musl toolchain
        if: ${{ matrix.musl_target }}
        run: |
          make -f Makefile.toolchain ${{ matrix.musl_target }} >/dev/null
          echo "$PWD/toolchains/${{ matrix.musl_target }}/bin" >> "$GITHUB_PATH"

      - name: install
        if: ${{ matrix.pkg_manager }}
        run: ${{ matrix.pkg_manager }} ${{ matrix.packages }}

      - name: build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: make CC=${{ matrix.cc }} ${{ matrix.musl_target && 'LDFLAGS_APPEND=-static' || '' }}

      - name: sign binaries
        if: |
          (startsWith(matrix.name, 'windows-') || startsWith(matrix.name, 'macOS-')) &&
          startsWith(github.ref, 'refs/tags/')
        uses: espressif/release-sign@master
        with:
          path: ./build
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-keyvault-uri: ${{ secrets.AZURE_KEYVAULT_URI }}
          azure-keyvault-cert-name: ${{ secrets.AZURE_KEYVAULT_CERT_NAME }}
          macos-signing-identity: ${{ secrets.MACOS_CS_IDENTITY_ID }}
          macos-certificate: ${{ secrets.MACOS_CS_CERTIFICATE }}
          macos-certificate-pwd: ${{ secrets.MACOS_CS_CERTIFICATE_PWD }}
          notarization-username: ${{ secrets.MACOS_CS_APPLE_ID }}
          notarization-password: ${{ secrets.MACOS_CS_APP_SPECIFIC_PASSWORD }}
          notarization-team-id: ${{ secrets.MACOS_CS_APPLE_TEAM_ID }}

      - name: package
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: make CC=${{ matrix.cc }} ${{ matrix.musl_target && 'LDFLAGS_APPEND=-static' || '' }} ${{ matrix.dist }}

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    name: release
    needs:
      - dist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: install commitizen
        run: pip install czespressif

      - name: get version
        id: get_version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          fi
          echo "VERSION=$VERSION" | tee -a $GITHUB_OUTPUT

      - name: generate changelog
        run: |
          cz changelog ${{ steps.get_version.outputs.VERSION }} --file-name changelog_body.md
          cat changelog_body.md

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog_body.md
          name: Version ${{ steps.get_version.outputs.version }}
          draft: true
          files: |
            artifacts/**/*
